# Default configuration supports Workers Builds: npm run build && npx wrangler deploy.
# Pages deployments use wrangler.pages.toml instead.
name = "birch-plumbing"
main = "worker/index.ts"
compatibility_date = "2026-10-23"
# Preserve non-secret settings configured in the Cloudflare dashboard.
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Always execute API routes, including GETs and unknown routes, before SPA fallback.
run_worker_first = ["/api", "/api/*"]
